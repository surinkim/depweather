name: pages

# Publishes the site to GitHub Pages: on every push to main (code changes)
# and after each successful data collection (data commits made with
# GITHUB_TOKEN do not trigger push workflows, so collect is chained here).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # What the page loads plus the plain-text views (llms.txt, today.md)
      # and the Atom feeds. Mockups, history and sources stay in the repository.
      # Feeds are rebuilt from data/latest.json; they are not stored in git.
      - name: Assemble site
        run: |
          mkdir -p _site/data _site/js
          cp index.html favicon.svg og.png robots.txt sitemap.xml llms.txt _site/
          cp js/stack.js _site/js/
          cp data/today.md _site/today.md
          cp -r fonts _site/
          cp data/latest.json _site/data/
          python3 collect/feeds.py --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
