name: pages

# Publishes the site to GitHub Pages: on every push to main (code changes)
# and after each successful data collection (data commits made with
# GITHUB_TOKEN do not trigger push workflows, so collect is chained here).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # What the page loads, the plain-text views (llms.txt, today.md),
      # the Atom feeds, one HTML page per package, and one SVG badge per
      # package. Mockups and sources stay in the repository. Compact history
      # JSON is copied so the counter view can draw long-term charts; it is
      # committed, unlike the feeds, package pages and badges, which are
      # rebuilt from data/latest.json. pages.py also rewrites _site/sitemap.xml
      # so each package is listed there.
      - name: Assemble site
        run: |
          mkdir -p _site/data/history _site/js
          cp index.html favicon.svg og.png robots.txt sitemap.xml llms.txt _site/
          cp js/stack.js js/pkg-path.js js/trends.js _site/js/
          cp data/today.md _site/today.md
          cp -r fonts _site/
          cp data/latest.json _site/data/
          find data/history -maxdepth 1 -name '*.json' -exec cp {} _site/data/history/ \;
          python3 collect/feeds.py --out _site
          python3 collect/pages.py --out _site
          python3 collect/badges.py --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
