name: collect

on:
  # Twice a day: GitHub may delay scheduled runs by hours or skip one,
  # so the second run keeps the site from going a whole day stale.
  schedule:
    - cron: "17 6 * * *"    # 06:17 UTC (15:17 KST)
    - cron: "17 18 * * *"   # 18:17 UTC (03:17 KST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r collect/requirements.txt

      - name: Collect
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional; empty is fine
        run: python collect/collect.py

      - name: Commit data
        run: |
          git config user.name "depweather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Publishing is in pages.yml, which runs after this workflow succeeds.
