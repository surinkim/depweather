name: collect

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r collect/requirements.txt

      - name: Collect
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional; empty is fine
        run: python collect/collect.py

      - name: Commit data
        run: |
          git config user.name "depweather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # After the repository goes public, add a GitHub Pages deploy here
      # (actions/upload-pages-artifact + actions/deploy-pages). See README.
